name: Publish website preview
on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/headlines.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-preview
  cancel-in-progress: false
jobs:
  publish:
    name: Build and publish preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and local links
        run: npm run check
      - name: Build for repository preview URL
        run: npm run build
        env:
          SITE_URL: https://1998kirankumar-hub.github.io/circuit-and-shelf
          SITE_BASE_PATH: /circuit-and-shelf
      - name: Validate preview paths and browser JavaScript
        run: npm test
        env:
          SITE_BASE_PATH: /circuit-and-shelf
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview
        id: deploy
        uses: actions/deploy-pages@v4
