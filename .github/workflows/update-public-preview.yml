name: Refresh public website preview
on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview/**'
      - 'content/headlines.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-site-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Generate browser-ready preview paths
        run: |
          npm run build
          node scripts/build-public-preview.mjs
        env:
          SITE_BASE_PATH: /1998kirankumar-hub/circuit-and-shelf/main/preview
      - name: Publish snapshot to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview
          if ! git diff --cached --quiet; then
            git commit -m 'Update public HTML preview snapshot'
            git push origin HEAD:main
          fi
